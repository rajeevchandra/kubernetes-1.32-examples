apiVersion: v1
kind: Pod
metadata:
  name: gpu-pod
spec:
  resourceClaims:
    - name: gpu
      source:
        resourceClaimTemplateName: gpu-claim-template
  containers:
    - name: ml-trainer
      image: your-ml-image
      command: ["python", "train.py"]
      resources:
        limits:
          nvidia.com/gpu: 1
